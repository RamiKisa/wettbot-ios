name: Refresh Wettbot data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: wettbot-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch fixtures, predictions and bookmaker odds
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 scripts/refresh_data.py
      - name: Commit generated recommendations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recommendations.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Refresh automated football analysis data"
            git push
          fi
