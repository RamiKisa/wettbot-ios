name: Refresh RamoBet data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_data.py'
      - 'scripts/feed_utils.py'
      - 'scripts/validate_data.py'
      - 'tests/test_feed_utils.py'
      - 'tests/test_validate_data.py'
      - 'competitions.json'
      - '.github/workflows/refresh-data.yml'
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: ramobet-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate, validate and publish current football data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Data refresh attempt ${attempt}/3"
            git fetch origin main
            git checkout -B main origin/main

            python3 -m py_compile scripts/refresh_data.py scripts/feed_utils.py scripts/validate_data.py
            python3 -m unittest discover -s tests -v
            python3 scripts/refresh_data.py
            python3 scripts/validate_data.py recommendations.json --config competitions.json --require-leagues

            git add recommendations.json
            if git diff --cached --quiet; then
              echo "Generated data has no changes; repository is already current."
              exit 0
            fi
            git commit -m "Refresh automated football analysis data"
            if git push origin HEAD:main; then
              echo "Published validated recommendations successfully."
              exit 0
            fi
            echo "Remote changed during publishing; retrying from current main."
            sleep $((attempt * 2))
          done
          echo "Could not publish after three attempts." >&2
          exit 1
